name: fumotoppara-watch

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # 15分おき。混雑する毎時0分を避けてずらしている（GitHub側で数分遅れることあり）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fumotoppara-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check
        run: python monitor.py
        env:
          FUMO_ID: ${{ secrets.FUMO_ID }}
          FUMO_PW: ${{ secrets.FUMO_PW }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          TARGET_DATES: ${{ vars.TARGET_DATES }}
          SITES: ${{ vars.SITES || 'キャンプ宿泊' }}

      # 公開リポジトリでは artifact を誰でも取得できるため、
      # ログイン後画面のスクリーンショット（debug/）はアップロードしない

      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
